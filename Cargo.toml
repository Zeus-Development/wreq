[workspace]
members = [
    "wreq-proto",
    "wreq-rt",
]
resolver = "3"

[workspace.package]
version = "0.2.6"
homepage = "https://github.com/0x676e67/wreq"
repository = "https://github.com/0x676e67/wreq-proto"
readme = "README.md"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
tokio = { version = "1.53.1", default-features = false }
wreq-proto = { path = "./wreq-proto", version = "0.2.5" }

[profile.release]
codegen-units = 1
incremental = false

[profile.bench]
codegen-units = 1
incremental = false

# VIPER-PATCH(h2-priority-order): the HTTP/2 client reads a request's
# urgency, a type of Viper's http2 fork (branch viper/http2-0.5.20), which
# this workspace builds in place of the published http2 0.5.20. A Viper
# build takes http2 from its own [patch.crates-io] entry, at the same rev.
[patch.crates-io]
http2 = { git = "https://github.com/Zeus-Development/wreq", rev = "01aa6f3c1b3337963492babce388eab879560098" }
